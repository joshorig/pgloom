[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgloom"
version = "0.2.0"
description = "Postgres-backed reusable workflow and task orchestration runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Josh Cassidy", email = "cassidy.joshua@googlemail.com" }]
keywords = ["orchestration", "workflow", "postgres", "task-queue", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1",
  "PyYAML>=6",
  "jsonschema>=4",
  "structlog>=24",
  "tenacity>=8",
  "httpx>=0.27",
  "orjson>=3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "pytest-timeout>=2",
  "freezegun>=1",
  "testcontainers[postgresql]>=4",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6",
]

[project.scripts]
pgloom = "pgloom.cli:app"

[project.urls]
Homepage = "https://github.com/joshorig/pgloom"
Repository = "https://github.com/joshorig/pgloom"
Issues = "https://github.com/joshorig/pgloom/issues"
Changelog = "https://github.com/joshorig/pgloom/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pgloom*"]

[tool.setuptools.package-data]
pgloom = ["db/schema/*.sql", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psycopg.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
timeout = 30
