name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check pgloom tests
      - run: mypy pgloom
      - run: pytest tests/unit -q

  integration-and-scenarios:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGLOOM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pgloom_test
      PGLOOM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pgloom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pgloom db migrate
      - run: pytest tests/integration -q
      - run: pytest tests/scenarios -q
